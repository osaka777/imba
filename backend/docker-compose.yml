name: 'onex'

services:
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - admin-panel

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_HOST: 'https://imba.bet'
      BACKEND_URL: 'http://backend:3000'
    expose:
      - "8000"

  backend:
    build:
      context: .
    restart: unless-stopped
    command: >
      sh -c "
        MIGRATE_URL=\"postgresql://onex:$${POSTGRES_PASSWORD}@postgres:5432/onex?schema=public\" &&
        DATABASE_URL=\"$$MIGRATE_URL\" npx prisma migrate deploy &&
        npx prisma generate &&
        npm run start:prod
      "
    env_file: '.env'
    environment:
      NODE_ENV: production
      DATABASE_URL: 'postgresql://onex_app:${POSTGRES_APP_PASSWORD}@postgres:5432/onex?schema=public&connection_limit=25&pool_timeout=20'
      TELEGRAM_NOTIFY_URL: 'http://imba-bot:8088/notify'
      PAYMENT_SETTINGS_PATH: '/data/logs/payment-settings.json'
    volumes:
      - ../data/logs:/data/logs
      - ./uploads:/app/uploads
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      imba-bot:
        condition: service_started

  admin-panel:
    build:
      context: ../admin-panel
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../admin-panel/.env
    environment:
      NEXTAUTH_URL: 'https://cdn.imba.bet'
    expose:
      - "9000"

  partners:
    build:
      context: ../partners
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - partners
    expose:
      - "8001"

  imba-bot:
    build:
      context: ../imba-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../imba-bot/.env
    environment:
      PORT: "8088"
    expose:
      - "8088"

  postgres:
    image: postgres:16.2
    restart: unless-stopped
    env_file: '.env'
    environment:
      POSTGRES_USER: 'onex'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: 'onex'
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
      POSTGRES_APP_PASSWORD: '${POSTGRES_APP_PASSWORD}'
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c log_connections=off
      -c log_disconnections=off
      -c password_encryption=scram-sha-256
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onex -d onex']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
